# Central report runs at 19:00 UTC and reads today's (UTC) uploads; each run must finish by 18:55 UTC. Last deploys are at 18:00 local.
name: Playwright E2E

on:
  schedule:
    # all shops, weekdays 16:30 UTC (staging shuts down after 19:00)
    - cron: '30 16 * * 1-5'
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shop:
        description: 'Shop to test'
        type: choice
        options: [all, hdtoner, hdtonerch, hqpatronen, hqpatronench, hqpatronen24_ch, tintencenter, druckerpatronen, hdtonerat, cartoucheclub]
        default: all
      grep:
        description: 'Only run tests matching (e.g. @smoke). Empty = full suite'
        required: false

jobs:
  e2e:
    name: ${{ matrix.shop }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # keep the tag in sync with @playwright/test in package.json
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      # all shops share the staging server: limit the load (3 jobs x 2 workers at a time)
      max-parallel: 3
      matrix:
        shop: [hdtoner, hdtonerch, hqpatronen, hqpatronench, hqpatronen24_ch, tintencenter, druckerpatronen, hdtonerat, cartoucheclub]
        include:
          - shop: hdtoner
            environment: hdtoner
            password_secret: HTTP_PASSWORD_HDTONER
          # hd-toner.ch runs the same suite with its own profile (projects/hdtonerch.ts) and uses the HD-Toner staging login
          - shop: hdtonerch
            environment: hdtonerch
            password_secret: HTTP_PASSWORD_HDTONER
          - shop: hqpatronen
            environment: hqpatronen
            password_secret: HTTP_PASSWORD_HQPATRONEN
          # staging.hq-patronen.ch uses the HQ-Patronen staging login
          - shop: hqpatronench
            environment: hqpatronench
            password_secret: HTTP_PASSWORD_HQPATRONEN
          - shop: hqpatronen24_ch
            environment: hqpatronen24-ch
            password_secret: HTTP_PASSWORD_HQPATRONEN24_CH
          - shop: tintencenter
            environment: tintencenter
            password_secret: HTTP_PASSWORD_TINTENCENTER
          - shop: druckerpatronen
            environment: druckerpatronen
            password_secret: HTTP_PASSWORD_DRUCKERPATRONEN
          # staging.hd-toner.at uses the HD-Toner staging login
          - shop: hdtonerat
            environment: hdtonerat
            password_secret: HTTP_PASSWORD_HDTONER
          - shop: cartoucheclub
            environment: cartoucheclub
            password_secret: HTTP_PASSWORD_CARTOUCHECLUB
    env:
      CI: 'true'
      HOME: /root
      PROJECT: ${{ matrix.shop }}
      ENVIRONMENT: ${{ matrix.environment }}
      OWNER: Shpresim Krasniqi
      # public repo: URLs come from secrets only (variables are visible in plain text in public logs)
      BASE_URL_HDTONER: ${{ secrets.BASE_URL_HDTONER }}
      BASE_URL_HDTONERCH: ${{ secrets.BASE_URL_HDTONERCH }}
      BASE_URL_HQPATRONEN: ${{ secrets.BASE_URL_HQPATRONEN }}
      BASE_URL_HQPATRONENCH: ${{ secrets.BASE_URL_HQPATRONENCH }}
      BASE_URL_HQPATRONEN24_CH: ${{ secrets.BASE_URL_HQPATRONEN24_CH }}
      BASE_URL_TINTENCENTER: ${{ secrets.BASE_URL_TINTENCENTER }}
      BASE_URL_DRUCKERPATRONEN: ${{ secrets.BASE_URL_DRUCKERPATRONEN }}
      BASE_URL_CARTOUCHECLUB: ${{ secrets.BASE_URL_CARTOUCHECLUB }}
      BASE_URL_HDTONERAT: ${{ secrets.BASE_URL_HDTONERAT }}
      EXTRA_BROWSERS: firefox
      ALLOW_WRITE_TESTS: 'true'
      CLEANUP_TEST_DATA: 'true'
      TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
      HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
      # each job only receives the password of its own shop
      HTTP_PASSWORD: ${{ secrets[matrix.password_secret] }}
      # optional (empty secrets are ignored by the suite)
      ADMIN_CLIENT_ID: ${{ secrets.ADMIN_CLIENT_ID }}
      ADMIN_CLIENT_SECRET: ${{ secrets.ADMIN_CLIENT_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # per-shop integration (wins over the generic ones above)
      HDTONER_ADMIN_CLIENT_ID: ${{ secrets.HDTONER_ADMIN_CLIENT_ID }}
      HDTONER_ADMIN_CLIENT_SECRET: ${{ secrets.HDTONER_ADMIN_CLIENT_SECRET }}
      HDTONERCH_ADMIN_CLIENT_ID: ${{ secrets.HDTONERCH_ADMIN_CLIENT_ID }}
      HDTONERCH_ADMIN_CLIENT_SECRET: ${{ secrets.HDTONERCH_ADMIN_CLIENT_SECRET }}
      HDTONERAT_ADMIN_CLIENT_ID: ${{ secrets.HDTONERAT_ADMIN_CLIENT_ID }}
      HDTONERAT_ADMIN_CLIENT_SECRET: ${{ secrets.HDTONERAT_ADMIN_CLIENT_SECRET }}
      HQPATRONEN_ADMIN_CLIENT_ID: ${{ secrets.HQPATRONEN_ADMIN_CLIENT_ID }}
      HQPATRONEN_ADMIN_CLIENT_SECRET: ${{ secrets.HQPATRONEN_ADMIN_CLIENT_SECRET }}
      HQPATRONENCH_ADMIN_CLIENT_ID: ${{ secrets.HQPATRONENCH_ADMIN_CLIENT_ID }}
      HQPATRONENCH_ADMIN_CLIENT_SECRET: ${{ secrets.HQPATRONENCH_ADMIN_CLIENT_SECRET }}
      HQPATRONEN24_CH_ADMIN_CLIENT_ID: ${{ secrets.HQPATRONEN24_CH_ADMIN_CLIENT_ID }}
      HQPATRONEN24_CH_ADMIN_CLIENT_SECRET: ${{ secrets.HQPATRONEN24_CH_ADMIN_CLIENT_SECRET }}
      TINTENCENTER_ADMIN_CLIENT_ID: ${{ secrets.TINTENCENTER_ADMIN_CLIENT_ID }}
      TINTENCENTER_ADMIN_CLIENT_SECRET: ${{ secrets.TINTENCENTER_ADMIN_CLIENT_SECRET }}
      DRUCKERPATRONEN_ADMIN_CLIENT_ID: ${{ secrets.DRUCKERPATRONEN_ADMIN_CLIENT_ID }}
      DRUCKERPATRONEN_ADMIN_CLIENT_SECRET: ${{ secrets.DRUCKERPATRONEN_ADMIN_CLIENT_SECRET }}
      CARTOUCHECLUB_ADMIN_CLIENT_ID: ${{ secrets.CARTOUCHECLUB_ADMIN_CLIENT_ID }}
      CARTOUCHECLUB_ADMIN_CLIENT_SECRET: ${{ secrets.CARTOUCHECLUB_ADMIN_CLIENT_SECRET }}
    steps:
      - name: Skip shops not selected
        id: select
        run: |
          SHOP="${{ github.event.inputs.shop }}"
          if [ -z "$SHOP" ] || [ "$SHOP" = "all" ] || [ "$SHOP" = "${{ matrix.shop }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.select.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.select.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.select.outputs.run == 'true'

      - name: Run tests
        if: steps.select.outputs.run == 'true'
        run: |
          GREP="${{ github.event.inputs.grep }}"
          # PRs and pushes: smoke only; scheduled + manual runs: full suite (or the given grep)
          case "${{ github.event_name }}" in pull_request|push) GREP="@smoke" ;; esac
          npx playwright test ${GREP:+--grep "$GREP"}

      # public repo: no upload-artifact (anyone with a GitHub account could download it); results go to Profihost only
      - name: Build QA summary
        if: always() && steps.select.outputs.run == 'true'
        env:
          # the job-level PROJECT is the shop profile for the suite; the report wants the project slug
          PROJECT: tonerpartner-automation
          RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npx tsx scripts/make-summary.ts

      # only full runs are uploaded: PR/push smoke runs and filtered manual runs would replace the day's real result
      - name: Upload to Profihost
        if: always() && steps.select.outputs.run == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.grep == ''))
        continue-on-error: true
        env:
          PROJECT: tonerpartner-automation
          PROFIHOST_HOST: ${{ secrets.PROFIHOST_HOST }}
          PROFIHOST_USER: ${{ secrets.PROFIHOST_USER }}
          PROFIHOST_SSH_KEY: ${{ secrets.PROFIHOST_SSH_KEY }}
          PROFIHOST_KNOWN_HOSTS: ${{ secrets.PROFIHOST_KNOWN_HOSTS }}
          PROFIHOST_PORT: ${{ secrets.PROFIHOST_PORT }}
        run: bash scripts/upload-profihost.sh
